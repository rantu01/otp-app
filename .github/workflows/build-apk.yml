name: Build Rantu_OTP APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 17 (required by Android Gradle Plugin 8.x)
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      # NOTE: ubuntu-latest runners already ship the Android SDK + cmdline-tools.
      # android-actions/setup-android@v3 is broken (it runs `sdkmanager tools`,
      # and the obsolete "tools" package no longer exists -> exit code 1),
      # so install only the packages this project needs (compileSdk 34).
      - name: Install Android SDK packages
        run: |
          if [ -z "$ANDROID_SDK_ROOT" ]; then
            ANDROID_SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          fi
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          yes | "$SDKMANAGER" --licenses > /dev/null || true

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Decode persistent release keystore
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        shell: bash
        env:
          KEYSTORE_B64: ${{ env.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/otp-release.jks"

      - name: Build signed release APK
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/otp-release.jks
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Require persistent release signing
        if: ${{ env.ANDROID_KEYSTORE_BASE64 == '' }}
        run: |
          echo "Missing ANDROID_KEYSTORE_BASE64 and release signing secrets."
          echo "Refusing to publish a debug-signed APK because it cannot reliably update an installed build."
          exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rantu_OTP-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Create GitHub Release and attach APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Rantu OTP ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: app/build/outputs/apk/release/*.apk
          fail_on_unmatched_files: true
          body: |
            Download the APK below and install it on Android.

            The APK is the only release asset provided by this workflow.
