name: Build rantuOTP APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 17 (required by Android Gradle Plugin 8.x)
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      # NOTE: ubuntu-latest runners already ship the Android SDK + cmdline-tools.
      # android-actions/setup-android@v3 is broken (it runs `sdkmanager tools`,
      # and the obsolete "tools" package no longer exists -> exit code 1),
      # so install only the packages this project needs (compileSdk 34).
      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          yes | sdkmanager --licenses > /dev/null || true

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rantuOTP-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
